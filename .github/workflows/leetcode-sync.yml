name: Sync LeetCode Submissions

on:
  schedule:
    # Runs every 6 hours. Adjust as you like (cron is in UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LeetCode sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python sync.py

      - name: Commit and push new solutions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync new LeetCode submissions"
          file_pattern: "problems/** synced_submissions.json"
