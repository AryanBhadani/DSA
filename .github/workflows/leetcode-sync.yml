name: Sync LeetCode Submissions

on:
  schedule:
    # Runs every 6 hours. Adjust as you like (cron is in UTC).
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LeetCode sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python sync.py

      - name: Configure Git
        run: |
          git config user.name "AryanBhadani"
          git config user.email "aryan.25bcon2785@jecrcu.edu.in"

      - name: Commit and push new solutions
        run: |
          git add problems/** synced_submissions.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync new LeetCode submissions"
            git push
          fi
