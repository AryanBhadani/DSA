name: Generate LeetCode Statistics

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate statistics card
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: "Aryanbhadani123"
        run: python generate_stats.py

      - name: Configure Git
        run: |
          git config user.name "AryanBhadani"
          git config user.email "aryan.25bcon2785@jecrcu.edu.in"

      - name: Commit and push statistics
        run: |
          git add leetcode_stats.svg last_stats_update.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update LeetCode statistics card"
            git push
          fi
